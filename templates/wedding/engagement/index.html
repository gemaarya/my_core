<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Engagement Invitation — geminvite</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold:    #c9a84c;
      --gold2:   #e8c97a;
      --dark:    #0a0812;
      --dark2:   #100d1c;
      --border:  rgba(201,168,76,0.22);
    }

    html, body {
      height: 100%;
      background: var(--dark);
      color: #fff;
      font-family: 'Cormorant Garamond', serif;
      overflow: hidden; /* no outer scroll — iframe scrolls itself */
    }

    /* ── LAYOUT ── */
    .page {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── TOP BAR ── */
    .topbar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 18px;
      background: var(--dark2);
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }

    .topbar-brand {
      font-family: 'Cinzel', serif;
      font-size: 13px;
      font-weight: 600;
      color: var(--gold);
      letter-spacing: 1.5px;
      white-space: nowrap;
    }

    .topbar-title {
      font-family: 'Cinzel', serif;
      font-size: 12px;
      font-weight: 400;
      color: rgba(255,255,255,0.55);
      letter-spacing: 0.8px;
      text-align: center;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .topbar-badge {
      flex-shrink: 0;
      font-family: 'Cinzel', serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1px;
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: rgba(201,168,76,0.08);
      color: var(--gold);
      white-space: nowrap;
    }

    /* ── CANVA FRAME AREA ── */
    .frame-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #000;
    }

    .frame-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Loading shimmer shown while iframe loads */
    .frame-loader {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: var(--dark);
      z-index: 2;
      transition: opacity 0.5s ease;
    }
    .frame-loader.hidden { opacity: 0; pointer-events: none; }

    .loader-spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(201,168,76,0.15);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loader-text {
      font-family: 'Cinzel', serif;
      font-size: 12px;
      color: rgba(255,255,255,0.35);
      letter-spacing: 2px;
    }

    .ornament {
      font-size: 22px;
      color: var(--gold);
      opacity: 0.6;
    }

    /* ── FOOTER ── */
    .footer {
      flex-shrink: 0;
      text-align: center;
      padding: 8px 16px;
      background: var(--dark2);
      border-top: 1px solid var(--border);
      font-family: 'Cinzel', serif;
      font-size: 10px;
      color: rgba(255,255,255,0.28);
      letter-spacing: 1.2px;
    }
    .footer span { color: var(--gold); opacity: 0.7; }
  </style>
</head>
<body>

<div class="page">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="topbar-brand">✦ gem invite</div>
    <div class="topbar-title">Engagement Invitation</div>
    <div class="topbar-badge">DEMO</div>
  </div>

  <!-- CANVA FRAME -->
  <div class="frame-wrap">

    <!-- Loading state -->
    <div class="frame-loader" id="loader">
      <div class="ornament">💍</div>
      <div class="loader-spinner"></div>
      <div class="loader-text">LOADING INVITATION</div>
    </div>

    <!-- Canva embed — fills entire remaining height -->
    <iframe
      id="canvaFrame"
      src="https://www.canva.com/design/DAHMQUaMefU/wLJ-2-CwafEFpfkR9NDrIg/watch?embed"
      allowfullscreen
      allow="fullscreen"
      loading="lazy"
    ></iframe>

  </div>

  <!-- FOOTER -->
  <div class="footer">
    Made with ❤ by <span>@gem_invite</span>
  </div>

</div>

<script>
  // Hide loader after Canva loads (Canva doesn't fire onload reliably, so use a timer)
  setTimeout(() => {
    document.getElementById('loader').classList.add('hidden');
  }, 2200);
</script>

</body>
</html>
